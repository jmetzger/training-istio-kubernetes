<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Arial, Helvetica, sans-serif">
<defs>
<marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e65100"/></marker>
<marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#311b92"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0d47a1"/></marker>
</defs>
<rect width="960" height="560" fill="#ffffff"/>
<text x="480" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#263238">Mehrere Netze: der Weg führt über das East-West-Gateway</text>

<!-- Netz 1 -->
<rect x="10" y="42" width="400" height="360" rx="12" fill="none" stroke="#78909c" stroke-width="2" stroke-dasharray="8 5"/>
<text x="24" y="62" font-size="12" font-weight="bold" fill="#546e7a">Netz 1 (network1)</text>
<rect x="22" y="75" width="376" height="314" rx="8" fill="#f1f8fe" stroke="#0d47a1" stroke-width="2.5"/>
<text x="210" y="97" text-anchor="middle" font-size="14" font-weight="bold" fill="#0d47a1">Cluster 1 (istio-system: network1)</text>
<rect x="250" y="112" width="135" height="38" rx="6" fill="#ede7f6" stroke="#311b92" stroke-width="2"/>
<text x="317" y="136" text-anchor="middle" font-size="13" font-weight="bold" fill="#311b92">istiod 1</text>
<rect x="250" y="168" width="135" height="38" rx="6" fill="#eceff1" stroke="#455a64" stroke-width="2"/>
<text x="317" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#37474f">kube-API 1</text>
<text x="36" y="132" font-size="11" fill="#455a64">Pod-IPs von Netz 2 sind hier</text>
<text x="36" y="148" font-size="11" fill="#455a64">nicht erreichbar, IP-Bereiche</text>
<text x="36" y="164" font-size="11" fill="#455a64">dürfen sich überschneiden</text>
<rect x="36" y="238" width="125" height="58" rx="6" fill="#ffffff" stroke="#0d47a1" stroke-width="2"/>
<text x="98" y="262" text-anchor="middle" font-size="12" font-weight="bold" fill="#0d47a1">frontend</text>
<text x="98" y="280" text-anchor="middle" font-size="10" fill="#455a64">Pod in Netz 1</text>
<rect x="290" y="330" width="96" height="46" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="2.5"/>
<text x="338" y="350" text-anchor="middle" font-size="11" font-weight="bold" fill="#e65100">East-West-</text>
<text x="338" y="365" text-anchor="middle" font-size="11" font-weight="bold" fill="#e65100">Gateway 1</text>

<!-- Netz 2 -->
<rect x="550" y="42" width="400" height="360" rx="12" fill="none" stroke="#78909c" stroke-width="2" stroke-dasharray="8 5"/>
<text x="564" y="62" font-size="12" font-weight="bold" fill="#546e7a">Netz 2 (network2)</text>
<rect x="562" y="75" width="376" height="314" rx="8" fill="#f1f8fe" stroke="#0d47a1" stroke-width="2.5"/>
<text x="750" y="97" text-anchor="middle" font-size="14" font-weight="bold" fill="#0d47a1">Cluster 2 (istio-system: network2)</text>
<rect x="575" y="112" width="135" height="38" rx="6" fill="#eceff1" stroke="#455a64" stroke-width="2"/>
<text x="642" y="136" text-anchor="middle" font-size="13" font-weight="bold" fill="#37474f">kube-API 2</text>
<rect x="575" y="168" width="135" height="38" rx="6" fill="#ede7f6" stroke="#311b92" stroke-width="2"/>
<text x="642" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#311b92">istiod 2</text>
<text x="725" y="132" font-size="11" fill="#455a64">Das Gateway ist der einzige</text>
<text x="725" y="148" font-size="11" fill="#455a64">Eingang in dieses Netz</text>
<rect x="800" y="238" width="125" height="58" rx="6" fill="#ffffff" stroke="#0d47a1" stroke-width="2"/>
<text x="862" y="262" text-anchor="middle" font-size="12" font-weight="bold" fill="#0d47a1">backend</text>
<text x="862" y="280" text-anchor="middle" font-size="10" fill="#455a64">Pod in Netz 2</text>
<rect x="574" y="330" width="96" height="46" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="2.5"/>
<text x="622" y="350" text-anchor="middle" font-size="11" font-weight="bold" fill="#e65100">East-West-</text>
<text x="622" y="365" text-anchor="middle" font-size="11" font-weight="bold" fill="#e65100">Gateway 2</text>

<!-- Remote Secrets -->
<line x1="385" y1="131" x2="575" y2="131" stroke="#311b92" stroke-width="2.5" marker-end="url(#p)"/>
<text x="480" y="123" text-anchor="middle" font-size="11" font-weight="bold" fill="#311b92">Remote-Secret</text>
<line x1="575" y1="187" x2="385" y2="187" stroke="#311b92" stroke-width="2.5" marker-end="url(#p)"/>
<text x="480" y="179" text-anchor="middle" font-size="11" font-weight="bold" fill="#311b92">Remote-Secret</text>

<!-- Datenpfad: frontend -> Gateway 2 -> backend -->
<path d="M161 267 L520 267 L520 353 L572 353" fill="none" stroke="#e65100" stroke-width="3" marker-end="url(#o)"/>
<path d="M672 353 L735 353 L735 267 L798 267" fill="none" stroke="#e65100" stroke-width="3" marker-end="url(#o)"/>
<text x="270" y="258" text-anchor="middle" font-size="12" font-weight="bold" fill="#e65100">mTLS durch das Gateway 2</text>
<text x="270" y="296" text-anchor="middle" font-size="11" fill="#e65100">Sidecar: Port 15443</text>
<text x="270" y="312" text-anchor="middle" font-size="11" fill="#e65100">Ambient: Port 15008 (HBONE)</text>
<text x="640" y="418" text-anchor="middle" font-size="11" fill="#455a64">Der Rückweg von Netz 2 nach Netz 1 läuft entsprechend über Gateway 1 (nicht eingezeichnet).</text>

<!-- Fußtext -->
<rect x="10" y="428" width="940" height="122" rx="8" fill="#fafafa" stroke="#b0bec5" stroke-width="1.5"/>
<text x="26" y="450" font-size="13" font-weight="bold" fill="#263238">Was zusätzlich nötig ist (gegenüber einem flachen Netz)</text>
<text x="26" y="471" font-size="12" fill="#37474f">1. Netzname je Netz: Label topology.istio.io/network am Namespace istio-system (und am Gateway).</text>
<text x="26" y="490" font-size="12" fill="#37474f">2. Pro Cluster ein East-West-Gateway, das eingehenden mTLS-Verkehr aus dem anderen Netz annimmt und an die Pods weiterreicht.</text>
<text x="26" y="509" font-size="12" fill="#37474f">3. Remote-Secrets wie im flachen Netz, die kube-API des anderen Clusters muss für istiod erreichbar bleiben.</text>
<text x="26" y="528" font-size="12" fill="#37474f">4. Ambient (Beta): Gateway-Klasse istio-east-west, Listener HBONE auf 15008. Gleichnamige Waypoints in allen Clustern, Konfiguration</text>
<text x="26" y="544" font-size="12" fill="#37474f">    selbst synchron halten (z. B. mit ArgoCD). Der zusätzliche Gateway-Hop kostet Latenz.</text>
</svg>
