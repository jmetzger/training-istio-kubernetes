<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#37474f"/></marker>
  </defs>
  <rect width="960" height="330" fill="#ffffff"/>
  <text x="480" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#263238">Welchen Wert für --for nehme ich?</text>

  <rect x="280" y="50" width="400" height="60" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="480" y="76" text-anchor="middle" font-size="15" font-weight="bold" fill="#0d47a1">Wie sprechen die Clients</text>
  <text x="480" y="96" text-anchor="middle" font-size="15" font-weight="bold" fill="#0d47a1">das Ziel an?</text>

  <line x1="400" y1="110" x2="240" y2="158" stroke="#37474f" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="560" y1="110" x2="720" y2="158" stroke="#37474f" stroke-width="2.5" marker-end="url(#a)"/>

  <rect x="30" y="160" width="420" height="120" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="240" y="190" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b5e20">Nur über den Service-Namen</text>
  <text x="240" y="212" text-anchor="middle" font-size="13" fill="#1b5e20">zum Beispiel reviews:9080</text>
  <text x="240" y="236" text-anchor="middle" font-size="13" fill="#1b5e20">der Normalfall, auch bei bookinfo</text>
  <text x="240" y="264" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b5e20">--for service</text>

  <rect x="510" y="160" width="420" height="120" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="720" y="190" text-anchor="middle" font-size="15" font-weight="bold" fill="#e65100">Auch direkt über Pod-IPs</text>
  <text x="720" y="212" text-anchor="middle" font-size="13" fill="#e65100">Headless Service, StatefulSet,</text>
  <text x="720" y="232" text-anchor="middle" font-size="13" fill="#e65100">Kafka oder Datenbank-Cluster</text>
  <text x="720" y="264" text-anchor="middle" font-size="16" font-weight="bold" fill="#e65100">--for all</text>

  <text x="480" y="312" text-anchor="middle" font-size="13" fill="#546e7a">Bei Unsicherheit: service nehmen und prüfen, ob irgendwo Pod-IPs direkt angesprochen werden.</text>
</svg>
