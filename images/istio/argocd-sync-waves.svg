<text x="22" y="236" font-size="12" fill="#263238"><tspan font-weight="bold">Wie die Waves wirken:</tspan> ArgoCD startet eine Wave erst, wenn alle Applications der vorherigen Wave Healthy sind.</text>
<text x="22" y="255" font-size="12" fill="#263238">Negative Zahlen laufen vor 0. Eine Application ohne Annotation liegt in Wave 0.</text>
<text x="22" y="274" font-size="12" fill="#263238">Die Annotation steht an jeder Application: argocd.argoproj.io/sync-wave</text>
