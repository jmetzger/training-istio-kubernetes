<text x="580" y="228" font-size="12" font-weight="bold" fill="#2e7d32">443 · Agent → Rancher</text>
<line x1="890" y1="320" x2="890" y2="186" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#g)"/>
<text x="880" y="228" text-anchor="end" font-size="12" font-weight="bold" fill="#2e7d32">443 · Agent → Rancher</text>

