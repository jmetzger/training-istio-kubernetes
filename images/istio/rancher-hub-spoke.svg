<line x1="40" y1="627" x2="80" y2="627" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#g)"/>
<text x="92" y="631" font-size="12" fill="#263238">Verbindung immer von innen nach außen: Agent im Downstream-Cluster → Rancher, Port 443, über die Hub-Firewall</text>
