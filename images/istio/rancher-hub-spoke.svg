<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" width="960" height="650" font-family="Arial, Helvetica, sans-serif">
<defs>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e7d32"/></marker>
</defs>
<rect width="960" height="650" fill="#ffffff"/>
<text x="480" y="24" text-anchor="middle" font-size="18" font-weight="bold" fill="#263238">Rancher im Hub-and-Spoke-Netz auf Azure (mit Istio Ambient)</text>

<!-- Hub -->
<rect x="10" y="38" width="940" height="160" rx="10" fill="#eceff1" stroke="#455a64" stroke-width="2.5"/>
<text x="480" y="58" text-anchor="middle" font-size="13" font-weight="bold" fill="#37474f">Hub-VNet (Netzwerk und Sicherheit, keine Anwendungen)</text>
<rect x="120" y="68" width="200" height="30" rx="6" fill="#ffffff" stroke="#78909c" stroke-width="1.5"/>
<text x="220" y="88" text-anchor="middle" font-size="12" fill="#37474f">VPN-/ExpressRoute-Gateway</text>
<rect x="380" y="68" width="200" height="30" rx="6" fill="#ffffff" stroke="#78909c" stroke-width="1.5"/>
<text x="480" y="88" text-anchor="middle" font-size="12" fill="#37474f">Bastion</text>
<rect x="640" y="68" width="200" height="30" rx="6" fill="#ffffff" stroke="#78909c" stroke-width="1.5"/>
<text x="740" y="88" text-anchor="middle" font-size="12" fill="#37474f">Private DNS-Zone</text>
<rect x="60" y="110" width="840" height="72" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
<text x="480" y="137" text-anchor="middle" font-size="16" font-weight="bold" fill="#b71c1c">Azure Firewall</text>
<text x="480" y="160" text-anchor="middle" font-size="12" fill="#b71c1c">Regeln: 443 zu Rancher, Registries, AKS-Pflichtregeln · Routing der Spokes per UDR</text>

<!-- Pfeile 443 -->
<line x1="250" y1="184" x2="250" y2="318" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#g)"/>
<text x="260" y="228" font-size="12" font-weight="bold" fill="#2e7d32">443 · eingehend bei Rancher</text>
