<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" font-family="Arial, Helvetica, sans-serif">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#37474f"/></marker>
</defs>
<rect width="1000" height="480" fill="#ffffff"/>
<text x="500" y="24" text-anchor="middle" font-size="18" font-weight="bold" fill="#263238">Zertifikatskette: Wer unterschreibt was?</text>

<!-- Ausserhalb des Clusters -->
<rect x="20" y="42" width="600" height="104" rx="8" fill="#f5f7f8" stroke="#90a4ae" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="32" y="60" font-size="12" font-weight="bold" fill="#546e7a">Außerhalb des Clusters: Firmen-PKI, Vault (in der Übung: Namespace cert-manager)</text>
<rect x="40" y="70" width="290" height="62" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
<text x="185" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#37474f">Root-CA (externe CA)</text>
<text x="185" y="116" text-anchor="middle" font-size="11" fill="#37474f">ihr privater Schlüssel bleibt hier</text>

<!-- Namespace istio-system -->
<rect x="20" y="172" width="600" height="104" rx="8" fill="#f5f7f8" stroke="#90a4ae" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="32" y="190" font-size="12" font-weight="bold" fill="#546e7a">Namespace istio-system</text>
<rect x="40" y="200" width="290" height="62" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
<text x="185" y="225" text-anchor="middle" font-size="14" font-weight="bold" fill="#37474f">Zwischen-CA (Secret cacerts)</text>
<text x="185" y="246" text-anchor="middle" font-size="11" fill="#37474f">Zertifikat und privater Schlüssel</text>
<rect x="390" y="200" width="210" height="62" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="495" y="225" text-anchor="middle" font-size="14" font-weight="bold" fill="#0d47a1">istiod</text>
<text x="495" y="246" text-anchor="middle" font-size="11" fill="#0d47a1">unterschreibt mit diesem Schlüssel</text>

<!-- Namespace bookinfo -->
<rect x="20" y="302" width="600" height="104" rx="8" fill="#f5f7f8" stroke="#90a4ae" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="32" y="320" font-size="12" font-weight="bold" fill="#546e7a">Workload im Namespace bookinfo (ztunnel hält das Zertifikat für den Pod)</text>
<rect x="40" y="330" width="560" height="62" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="320" y="355" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">Zertifikat des Workloads</text>
<text x="320" y="376" text-anchor="middle" font-size="11" fill="#1b5e20">Aussteller (Issuer): die Zwischen-CA, gültig 24 Stunden</text>

<!-- Pfeile -->
<line x1="185" y1="134" x2="185" y2="198" stroke="#37474f" stroke-width="2.5" marker-end="url(#a)"/>
<text x="195" y="164" font-size="11" fill="#37474f">unterschreibt nur das Zertifikat der Zwischen-CA</text>
<line x1="332" y1="231" x2="388" y2="231" stroke="#37474f" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="495" y1="264" x2="495" y2="328" stroke="#37474f" stroke-width="2.5" marker-end="url(#a)"/>
<text x="485" y="294" text-anchor="end" font-size="11" fill="#37474f">unterschreibt jede Anfrage (CSR) der Workloads</text>

<!-- Pruefung -->
<rect x="650" y="42" width="330" height="364" rx="8" fill="#eceff1" stroke="#607d8b" stroke-width="2"/>
<text x="815" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#37474f">So prüft die Gegenseite (mTLS)</text>
<text x="668" y="108" font-size="12" font-weight="bold" fill="#263238">1. Zertifikat des Workloads</text>
<text x="668" y="126" font-size="12" fill="#263238">Hat die Zwischen-CA unterschrieben?</text>
<text x="668" y="170" font-size="12" font-weight="bold" fill="#263238">2. Zertifikat der Zwischen-CA</text>
<text x="668" y="188" font-size="12" fill="#263238">Hat die Root-CA unterschrieben?</text>
<text x="668" y="206" font-size="12" fill="#263238">Darf sie Zertifikate ausstellen (CA:TRUE)?</text>
<text x="668" y="250" font-size="12" font-weight="bold" fill="#263238">3. Zertifikat der Root-CA</text>
<text x="668" y="268" font-size="12" fill="#263238">Ist das mein Vertrauensanker?</text>
<line x1="668" y1="300" x2="962" y2="300" stroke="#90a4ae" stroke-width="1"/>
<text x="668" y="328" font-size="12" fill="#263238">Dreimal ja: Das Zertifikat gilt.</text>
<text x="668" y="352" font-size="12" fill="#263238">Geprüft wird von unten nach oben,</text>
<text x="668" y="370" font-size="12" fill="#263238">unterschrieben von oben nach unten.</text>

<rect x="20" y="422" width="960" height="46" rx="6" fill="#f5f7f8" stroke="#cfd8dc"/>
<text x="34" y="442" font-size="12" fill="#263238"><tspan font-weight="bold">Merke:</tspan> Die Root-CA unterschreibt ein einziges Zertifikat, das der Zwischen-CA. Alle Workload-Zertifikate unterschreibt istiod.</text>
<text x="34" y="459" font-size="12" fill="#263238">Die externe CA sieht die einzelnen Workload-Zertifikate nie.</text>
</svg>
