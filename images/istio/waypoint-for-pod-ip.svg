<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#37474f"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e7d32"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c62828"/></marker>
  </defs>
  <rect width="960" height="470" fill="#ffffff"/>
  <text x="480" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#263238">Aufruf direkt an eine Pod-IP</text>

  <!-- oben: for service -->
  <text x="20" y="62" font-size="15" font-weight="bold" fill="#263238">Waypoint mit --for service</text>
  <rect x="40" y="80" width="150" height="70" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="115" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#5d4037">productpage</text>
  <text x="115" y="130" text-anchor="middle" font-size="12" fill="#5d4037">ruft 10.244.1.17 auf</text>
  <rect x="405" y="80" width="150" height="70" rx="6" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="480" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#757575">Waypoint</text>
  <text x="480" y="130" text-anchor="middle" font-size="12" fill="#757575">wird nicht gefragt</text>
  <rect x="770" y="80" width="150" height="70" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="845" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#5d4037">reviews-v1</text>
  <text x="845" y="130" text-anchor="middle" font-size="12" fill="#5d4037">10.244.1.17</text>
  <path d="M115,150 L115,195 L845,195 L845,152" fill="none" stroke="#c62828" stroke-width="3" marker-end="url(#r)"/>
  <text x="480" y="222" text-anchor="middle" font-size="14" font-weight="bold" fill="#c62828">Der Aufruf läuft am Waypoint vorbei: keine L7-Regeln</text>

  <line x1="20" y1="250" x2="940" y2="250" stroke="#cfd8dc" stroke-width="1.5"/>

  <!-- unten: for all -->
  <text x="20" y="282" font-size="15" font-weight="bold" fill="#263238">Waypoint mit --for all (oder --for workload)</text>
  <rect x="40" y="300" width="150" height="70" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="115" y="330" text-anchor="middle" font-size="15" font-weight="bold" fill="#5d4037">productpage</text>
  <text x="115" y="350" text-anchor="middle" font-size="12" fill="#5d4037">ruft 10.244.1.17 auf</text>
  <rect x="405" y="300" width="150" height="70" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="480" y="330" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b5e20">Waypoint</text>
  <text x="480" y="350" text-anchor="middle" font-size="12" fill="#1b5e20">Regeln anwenden</text>
  <rect x="770" y="300" width="150" height="70" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="845" y="330" text-anchor="middle" font-size="15" font-weight="bold" fill="#5d4037">reviews-v1</text>
  <text x="845" y="350" text-anchor="middle" font-size="12" fill="#5d4037">10.244.1.17</text>
  <line x1="190" y1="335" x2="403" y2="335" stroke="#2e7d32" stroke-width="3.5" marker-end="url(#g)"/>
  <line x1="557" y1="335" x2="768" y2="335" stroke="#2e7d32" stroke-width="3.5" marker-end="url(#g)"/>
  <text x="480" y="420" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">Auch dieser Aufruf geht durch den Waypoint: die Regeln wirken</text>
  <text x="480" y="448" text-anchor="middle" font-size="12" fill="#546e7a">Namespace bookinfo, alle Pods wie im Bild darüber</text>
</svg>
