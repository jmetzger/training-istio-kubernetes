<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 740" width="960" height="740" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#37474f"/></marker>
    <marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#00897b"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c62828"/></marker>
  </defs>
  <rect width="960" height="740" fill="#ffffff"/>
  <text x="480" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#263238">Kong und der Waypoint: Regel "/headers verboten" am Waypoint</text>

  <!-- A: Standard -->
  <text x="20" y="60" font-size="15" font-weight="bold" fill="#263238">A  Standard: Kong routet auf die Pod-IP, Waypoint mit --for service</text>
  <rect x="30" y="76" width="190" height="64" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5"/>
  <text x="125" y="104" text-anchor="middle" font-size="15" font-weight="bold" fill="#0d47a1">Kong Gateway</text>
  <text x="125" y="124" text-anchor="middle" font-size="12" fill="#0d47a1">Ziel: Pod-IP</text>
  <rect x="395" y="76" width="170" height="64" rx="6" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="480" y="104" text-anchor="middle" font-size="15" font-weight="bold" fill="#757575">Waypoint</text>
  <text x="480" y="124" text-anchor="middle" font-size="12" fill="#757575">wird nicht gefragt</text>
  <rect x="740" y="76" width="190" height="64" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="835" y="104" text-anchor="middle" font-size="15" font-weight="bold" fill="#5d4037">httpbin</text>
  <text x="835" y="124" text-anchor="middle" font-size="12" fill="#5d4037">Pod</text>
  <path d="M125,140 L125,176 L835,176 L835,142" fill="none" stroke="#c62828" stroke-width="3" marker-end="url(#r)"/>
  <text x="480" y="200" text-anchor="middle" font-size="14" font-weight="bold" fill="#c62828">GET /httpbin/headers  ergibt  HTTP 200: die Regel greift nicht</text>

  <line x1="20" y1="222" x2="940" y2="222" stroke="#cfd8dc" stroke-width="1.5"/>

  <!-- B: service-upstream -->
  <text x="20" y="252" font-size="15" font-weight="bold" fill="#263238">B  Lösung 1: Annotation ingress.kubernetes.io/service-upstream: "true" am Service</text>
  <rect x="30" y="268" width="190" height="64" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5"/>
  <text x="125" y="296" text-anchor="middle" font-size="15" font-weight="bold" fill="#0d47a1">Kong Gateway</text>
  <text x="125" y="316" text-anchor="middle" font-size="12" fill="#0d47a1">Ziel: Service (ClusterIP)</text>
  <rect x="395" y="268" width="170" height="64" rx="6" fill="#e0f2f1" stroke="#00897b" stroke-width="2.5"/>
  <text x="480" y="296" text-anchor="middle" font-size="15" font-weight="bold" fill="#004d40">Waypoint</text>
  <text x="480" y="316" text-anchor="middle" font-size="12" fill="#004d40">wendet L7-Regel an</text>
  <rect x="740" y="268" width="190" height="64" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="835" y="296" text-anchor="middle" font-size="15" font-weight="bold" fill="#5d4037">httpbin</text>
  <text x="835" y="316" text-anchor="middle" font-size="12" fill="#5d4037">Pod</text>
  <line x1="222" y1="300" x2="393" y2="300" stroke="#00897b" stroke-width="3.5" marker-end="url(#t)"/>
  <line x1="567" y1="300" x2="738" y2="300" stroke="#00897b" stroke-width="3.5" marker-end="url(#t)"/>
  <text x="480" y="362" text-anchor="middle" font-size="14" font-weight="bold" fill="#004d40">GET /httpbin/headers  ergibt  HTTP 403, /httpbin/get weiter 200</text>

  <line x1="20" y1="384" x2="940" y2="384" stroke="#cfd8dc" stroke-width="1.5"/>

  <!-- C: waypoint-for all -->
  <text x="20" y="414" font-size="15" font-weight="bold" fill="#263238">C  Lösung 2: Waypoint mit --for all, Kong routet weiter auf die Pod-IP</text>
  <rect x="30" y="430" width="190" height="64" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5"/>
  <text x="125" y="458" text-anchor="middle" font-size="15" font-weight="bold" fill="#0d47a1">Kong Gateway</text>
  <text x="125" y="478" text-anchor="middle" font-size="12" fill="#0d47a1">Ziel: Pod-IP</text>
  <rect x="395" y="430" width="170" height="64" rx="6" fill="#e0f2f1" stroke="#00897b" stroke-width="2.5"/>
  <text x="480" y="458" text-anchor="middle" font-size="15" font-weight="bold" fill="#004d40">Waypoint</text>
  <text x="480" y="478" text-anchor="middle" font-size="12" fill="#004d40">fängt auch Pod-IP ab</text>
  <rect x="740" y="430" width="190" height="64" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="835" y="458" text-anchor="middle" font-size="15" font-weight="bold" fill="#5d4037">httpbin</text>
  <text x="835" y="478" text-anchor="middle" font-size="12" fill="#5d4037">Pod</text>
  <line x1="222" y1="462" x2="393" y2="462" stroke="#00897b" stroke-width="3.5" marker-end="url(#t)"/>
  <line x1="567" y1="462" x2="738" y2="462" stroke="#00897b" stroke-width="3.5" marker-end="url(#t)"/>
  <text x="480" y="524" text-anchor="middle" font-size="14" font-weight="bold" fill="#004d40">GET /httpbin/headers  ergibt  HTTP 403, /httpbin/get weiter 200</text>

  <rect x="10" y="552" width="940" height="174" rx="8" fill="#fafafa" stroke="#cfd8dc" stroke-width="1"/>
  <text x="24" y="578" font-size="13" fill="#263238"><tspan font-weight="bold">Warum A?</tspan> Der Kong Ingress Controller trägt die Pod-IPs der Endpoints als Ziele ein, nicht die Service-IP.</text>
  <text x="24" y="598" font-size="13" fill="#263238">Ohne --for all ist der Waypoint nur für Aufrufe an den Service zuständig.</text>
  <text x="24" y="626" font-size="13" fill="#263238"><tspan font-weight="bold">Lösung 1</tspan> ändert Kong: Er ruft den Service auf, der ztunnel schickt den Aufruf zum Waypoint. Gilt pro Service.</text>
  <text x="24" y="654" font-size="13" fill="#263238"><tspan font-weight="bold">Lösung 2</tspan> ändert den Waypoint: Auch Aufrufe an Pod-IPs laufen hindurch, im Namespace also für jeden Aufrufer.</text>
  <text x="24" y="682" font-size="13" fill="#263238"><tspan font-weight="bold">Prüfen:</tspan> immer mit einem Pfad testen, den die Regel verbietet. Ein 200 auf dem verbotenen Pfad zeigt die Umgehung.</text>
  <text x="24" y="710" font-size="12" fill="#546e7a">Gemessen auf Istio 1.31.4, Kong Gateway 3.9 (Chart kong/ingress 0.24.0), Kubernetes 1.37.2.</text>
</svg>
