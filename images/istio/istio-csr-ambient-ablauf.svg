<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" font-family="Arial, Helvetica, sans-serif">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#37474f"/></marker>
</defs>
<rect width="1000" height="480" fill="#ffffff"/>
<text x="500" y="24" text-anchor="middle" font-size="18" font-weight="bold" fill="#263238">istio-csr im Ambient-Mesh: Wer fragt wen nach einem Zertifikat?</text>

<!-- Namespace cert-manager -->
<rect x="20" y="42" width="960" height="104" rx="8" fill="#f5f7f8" stroke="#90a4ae" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="32" y="60" font-size="12" font-weight="bold" fill="#546e7a">Namespace cert-manager</text>
<rect x="290" y="70" width="330" height="62" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="455" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#0d47a1">istio-csr</text>
<text x="455" y="116" text-anchor="middle" font-size="11" fill="#0d47a1">nimmt die Anfragen an, prüft die Identität</text>
<rect x="660" y="70" width="300" height="62" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="810" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#0d47a1">cert-manager</text>
<text x="810" y="116" text-anchor="middle" font-size="11" fill="#0d47a1">bearbeitet jede CertificateRequest</text>

<!-- Namespace istio-system -->
<rect x="20" y="172" width="960" height="104" rx="8" fill="#f5f7f8" stroke="#90a4ae" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="290" y="190" font-size="12" font-weight="bold" fill="#546e7a">Namespace istio-system</text>
<rect x="40" y="200" width="210" height="62" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="145" y="225" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">ztunnel</text>
<text x="145" y="246" text-anchor="middle" font-size="11" fill="#1b5e20">einer pro Node</text>
<rect x="290" y="200" width="210" height="62" rx="8" fill="#eceff1" stroke="#607d8b" stroke-width="2"/>
<text x="395" y="225" text-anchor="middle" font-size="14" font-weight="bold" fill="#37474f">istiod</text>
<text x="395" y="246" text-anchor="middle" font-size="11" fill="#37474f">ist keine CA mehr</text>
<rect x="660" y="200" width="300" height="62" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
<text x="810" y="225" text-anchor="middle" font-size="14" font-weight="bold" fill="#37474f">Issuer istio-ca (Secret istio-ca)</text>
<text x="810" y="246" text-anchor="middle" font-size="11" fill="#37474f">CA-Schlüssel, in Produktion: Vault, Firmen-PKI</text>

<!-- Namespace bookinfo -->
<rect x="20" y="302" width="960" height="104" rx="8" fill="#f5f7f8" stroke="#90a4ae" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="290" y="320" font-size="12" font-weight="bold" fill="#546e7a">Namespace bookinfo</text>
<rect x="40" y="330" width="210" height="62" rx="8" fill="#eceff1" stroke="#607d8b" stroke-width="2"/>
<text x="145" y="355" text-anchor="middle" font-size="14" font-weight="bold" fill="#37474f">Pods (reviews, details)</text>
<text x="145" y="376" text-anchor="middle" font-size="11" fill="#37474f">fragen selbst nichts an</text>
<rect x="290" y="330" width="330" height="62" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="455" y="355" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">Waypoint und Gateway</text>
<text x="455" y="376" text-anchor="middle" font-size="11" fill="#1b5e20">eigener Pod, eigener ServiceAccount</text>

<!-- Pfeile -->
<line x1="145" y1="328" x2="145" y2="264" stroke="#37474f" stroke-width="2.5" marker-end="url(#a)"/>
<text x="155" y="294" font-size="11" fill="#37474f">ztunnel erledigt mTLS für die Pods</text>
<polyline points="145,198 145,101 288,101" fill="none" stroke="#37474f" stroke-width="2.5" marker-end="url(#a)"/>
<text x="155" y="164" font-size="11" fill="#37474f">Anfrage (CSR) im Namen der Pods</text>
<line x1="560" y1="328" x2="560" y2="134" stroke="#37474f" stroke-width="2.5" marker-end="url(#a)"/>
<text x="570" y="294" font-size="11" fill="#37474f">Anfrage (CSR) für sich selbst</text>
<line x1="622" y1="101" x2="658" y2="101" stroke="#37474f" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="810" y1="134" x2="810" y2="198" stroke="#37474f" stroke-width="2.5" marker-end="url(#a)"/>
<text x="820" y="164" font-size="11" fill="#37474f">lässt unterschreiben</text>

<rect x="20" y="422" width="960" height="46" rx="6" fill="#f5f7f8" stroke="#cfd8dc"/>
<text x="34" y="442" font-size="12" fill="#263238"><tspan font-weight="bold">Merke:</tspan> Jede Anfrage geht über istio-csr an den Issuer. Er muss immer erreichbar sein, die Zertifikate gelten nur 1 Stunde.</text>
<text x="34" y="459" font-size="12" fill="#263238">Nur ztunnel fragt für andere an und braucht dafür den Eintrag caTrustedNodeAccounts. Waypoint und Gateway brauchen ihn nicht.</text>
</svg>
