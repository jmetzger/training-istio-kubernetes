<text x="716" y="344" font-size="11" fill="#455a64">Identität = Namespace + ServiceAccount</text>

<!-- Namespace istio-system -->
<rect x="10" y="384" width="940" height="164" rx="10" fill="#eef4fb" stroke="#1565c0" stroke-width="2.5"/>
<text x="480" y="406" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d47a1">Namespace istio-system (Plattform)</text>
<rect x="30" y="420" width="220" height="62" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="140" y="446" text-anchor="middle" font-size="14" font-weight="bold" fill="#0d47a1">ztunnel auf Node 1</text>
<text x="140" y="465" text-anchor="middle" font-size="11" fill="#0d47a1">mTLS (HBONE, Port 15008)</text>
<rect x="270" y="420" width="220" height="62" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="380" y="446" text-anchor="middle" font-size="14" font-weight="bold" fill="#0d47a1">ztunnel auf Node 2</text>
<text x="380" y="465" text-anchor="middle" font-size="11" fill="#0d47a1">mTLS (HBONE, Port 15008)</text>
<rect x="510" y="420" width="220" height="62" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="620" y="446" text-anchor="middle" font-size="14" font-weight="bold" fill="#0d47a1">ztunnel auf Node 3</text>
<text x="620" y="465" text-anchor="middle" font-size="11" fill="#0d47a1">mTLS (HBONE, Port 15008)</text>
<rect x="750" y="420" width="180" height="62" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="840" y="446" text-anchor="middle" font-size="14" font-weight="bold" fill="#0d47a1">istiod</text>
<text x="840" y="465" text-anchor="middle" font-size="11" fill="#0d47a1">Zertifikate, Konfiguration</text>
<text x="480" y="512" text-anchor="middle" font-size="12" fill="#263238">Der ztunnel am Ziel-Node prüft die AuthorizationPolicy und lässt nur die erlaubte Identität an Port 5432 durch.</text>
<text x="480" y="532" text-anchor="middle" font-size="12" fill="#263238">Der Operator liegt außerhalb des Meshes und hat deshalb keine Identität: Port 8000 braucht eine Ausnahme.</text>
</svg>
