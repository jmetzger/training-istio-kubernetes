<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="920" height="470" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#37474f"/></marker>
  </defs>
  <rect width="920" height="470" fill="#ffffff"/>
  <text x="460" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#263238">Zero Trust im Ambient-Mesh: Wer entscheidet wo?</text>
  <text x="460" y="46" text-anchor="middle" font-size="12" fill="#546e7a">Weg einer Anfrage aus dem Internet bis zu den Bookinfo-Pods (Namespace bookinfo)</text>

  <!-- Weg der Anfrage -->
  <rect x="20" y="75" width="140" height="70" rx="6" fill="#f5f5f5" stroke="#90a4ae" stroke-width="1.5"/>
  <text x="90" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#37474f">Browser</text>
  <text x="90" y="124" text-anchor="middle" font-size="11" fill="#546e7a">von aussen</text>

  <rect x="225" y="75" width="190" height="70" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5"/>
  <text x="320" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#0d47a1">Gateway-Pod</text>
  <text x="320" y="124" text-anchor="middle" font-size="11" fill="#0d47a1">bookinfo-gateway</text>

  <rect x="480" y="75" width="190" height="70" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="2.5"/>
  <text x="575" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#bf360c">Waypoint</text>
  <text x="575" y="124" text-anchor="middle" font-size="11" fill="#bf360c">Layer 7</text>

  <rect x="735" y="75" width="165" height="70" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="817" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">Bookinfo-Pods</text>
  <text x="817" y="116" text-anchor="middle" font-size="11" fill="#1b5e20">productpage, details,</text>
  <text x="817" y="131" text-anchor="middle" font-size="11" fill="#1b5e20">reviews, ratings</text>

  <line x1="160" y1="110" x2="223" y2="110" stroke="#37474f" stroke-width="2" marker-end="url(#a)"/>
  <line x1="415" y1="110" x2="478" y2="110" stroke="#37474f" stroke-width="2" marker-end="url(#a)"/>
  <line x1="670" y1="110" x2="733" y2="110" stroke="#37474f" stroke-width="2" marker-end="url(#a)"/>
  <text x="191" y="100" text-anchor="middle" font-size="10" fill="#546e7a">HTTP</text>
  <text x="447" y="100" text-anchor="middle" font-size="10" fill="#546e7a">mTLS</text>
  <text x="702" y="100" text-anchor="middle" font-size="10" fill="#546e7a">mTLS</text>

  <!-- Verbindungslinien zu den Karten -->
  <line x1="320" y1="145" x2="320" y2="190" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="575" y1="145" x2="575" y2="190" stroke="#e65100" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="817" y1="145" x2="817" y2="190" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Karte Gateway -->
  <rect x="195" y="190" width="250" height="195" rx="6" fill="#ffffff" stroke="#1565c0" stroke-width="2"/>
  <text x="320" y="214" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d47a1">Policy im Gateway-Pod</text>
  <text x="320" y="233" text-anchor="middle" font-size="11" fill="#37474f">Envoy im Gateway-Pod entscheidet</text>
  <text x="320" y="268" text-anchor="middle" font-size="12" font-weight="bold" fill="#263238">deny-all (ganzer Namespace)</text>
  <text x="320" y="286" text-anchor="middle" font-size="11" fill="#37474f">sperrt auch das Gateway</text>
  <text x="320" y="316" text-anchor="middle" font-size="12" font-weight="bold" fill="#263238">allow-gateway-inbound</text>
  <text x="320" y="334" text-anchor="middle" font-size="11" fill="#37474f">erlaubt GET am Gateway</text>
  <text x="320" y="372" text-anchor="middle" font-size="11" fill="#546e7a">Schritt 4 und 7</text>

  <!-- Karte Waypoint -->
  <rect x="460" y="190" width="230" height="195" rx="6" fill="#ffffff" stroke="#e65100" stroke-width="2"/>
  <text x="575" y="214" text-anchor="middle" font-size="13" font-weight="bold" fill="#bf360c">Policies am Waypoint</text>
  <text x="575" y="233" text-anchor="middle" font-size="11" fill="#37474f">Layer 7: Wer? Methode? Pfad? Header?</text>
  <text x="575" y="268" text-anchor="middle" font-size="12" font-weight="bold" fill="#263238">waypoint-deny-all</text>
  <text x="575" y="286" text-anchor="middle" font-size="11" fill="#37474f">am Waypoint ist erstmal alles zu</text>
  <text x="575" y="316" text-anchor="middle" font-size="12" font-weight="bold" fill="#263238">eine ALLOW-Policy je Service</text>
  <text x="575" y="334" text-anchor="middle" font-size="11" fill="#37474f">Aufrufer + Methode + Pfad</text>
  <text x="575" y="372" text-anchor="middle" font-size="11" fill="#546e7a">Schritt 8 bis 12, 14</text>

  <!-- Karte ztunnel -->
  <rect x="710" y="190" width="200" height="195" rx="6" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
  <text x="810" y="214" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b5e20">Policies im ztunnel</text>
  <text x="810" y="233" text-anchor="middle" font-size="11" fill="#37474f">Layer 4: Wer? Namespace? Port?</text>
  <text x="810" y="268" text-anchor="middle" font-size="12" font-weight="bold" fill="#263238">deny-all (ganzer Namespace)</text>
  <text x="810" y="286" text-anchor="middle" font-size="11" fill="#37474f">Pods nehmen nichts an</text>
  <text x="810" y="316" text-anchor="middle" font-size="12" font-weight="bold" fill="#263238">allow-waypoint</text>
  <text x="810" y="334" text-anchor="middle" font-size="11" fill="#37474f">nur der Waypoint darf an die Pods</text>
  <text x="810" y="372" text-anchor="middle" font-size="11" fill="#546e7a">Schritt 4 bis 6</text>

  <!-- Grundlage mTLS -->
  <rect x="20" y="405" width="880" height="42" rx="6" fill="#f5f5f5" stroke="#90a4ae" stroke-width="1.5"/>
  <text x="460" y="424" text-anchor="middle" font-size="12" font-weight="bold" fill="#263238">Grundlage: PeerAuthentication STRICT (Schritt 3)</text>
  <text x="460" y="440" text-anchor="middle" font-size="11" fill="#37474f">Verkehr ohne mTLS wird abgelehnt. Nur so sind die Identitaeten (Service Accounts) in den Policies verlaesslich.</text>
</svg>
