<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#00897b"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c62828"/></marker>
  </defs>
  <rect width="960" height="720" fill="#ffffff"/>
  <text x="480" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#263238">Gateway und Waypoint: Regel "/api/v1/products verboten" am Waypoint</text>

  <!-- A: ohne Label -->
  <text x="20" y="56" font-size="15" font-weight="bold" fill="#263238">A  Standard: Das Gateway baut den Tunnel direkt zum Pod</text>
  <rect x="20" y="66" width="920" height="118" rx="8" fill="#fafafa" stroke="#90a4ae" stroke-width="1.5"/>
  <text x="32" y="84" font-size="12" font-weight="bold" fill="#546e7a">Namespace bookinfo</text>
  <rect x="40" y="94" width="210" height="60" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5"/>
  <text x="145" y="120" text-anchor="middle" font-size="15" font-weight="bold" fill="#0d47a1">bookinfo-gateway</text>
  <text x="145" y="140" text-anchor="middle" font-size="12" fill="#0d47a1">Ziel: Pod-IP, Port 9080</text>
  <rect x="385" y="94" width="190" height="60" rx="6" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="480" y="120" text-anchor="middle" font-size="15" font-weight="bold" fill="#757575">Waypoint</text>
  <text x="480" y="140" text-anchor="middle" font-size="12" fill="#757575">wird nicht gefragt</text>
  <rect x="730" y="94" width="190" height="60" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="825" y="120" text-anchor="middle" font-size="15" font-weight="bold" fill="#5d4037">productpage</text>
  <text x="825" y="140" text-anchor="middle" font-size="12" fill="#5d4037">Pod</text>
  <path d="M145,154 L145,172 L825,172 L825,156" fill="none" stroke="#c62828" stroke-width="3" marker-end="url(#r)"/>

  <rect x="20" y="192" width="920" height="40" rx="8" fill="#fafafa" stroke="#90a4ae" stroke-width="1.5"/>
  <text x="32" y="217" font-size="12" font-weight="bold" fill="#546e7a">Namespace istio-system</text>
  <text x="200" y="217" font-size="13" fill="#263238">ztunnel (Node von productpage) loggt:  <tspan font-weight="bold" fill="#c62828">src.workload="bookinfo-gateway-istio-..."</tspan></text>

  <text x="20" y="258" font-size="14" font-weight="bold" fill="#c62828">GET /api/v1/products über das Gateway ergibt HTTP 200: die Regel greift nicht</text>
  <text x="20" y="282" font-size="13" fill="#263238"><tspan font-weight="bold">Gateway-Log:</tspan> connect_originate/&lt;Pod-IP&gt;:9080      <tspan font-weight="bold" dx="24">Waypoint-Log:</tspan> kein Eintrag für den Aufruf</text>

  <line x1="20" y1="304" x2="940" y2="304" stroke="#cfd8dc" stroke-width="1.5"/>

  <!-- B: mit Label -->
  <text x="20" y="334" font-size="15" font-weight="bold" fill="#263238">B  Mit Label istio.io/ingress-use-waypoint=true am Service oder Namespace</text>
  <rect x="20" y="344" width="920" height="118" rx="8" fill="#fafafa" stroke="#90a4ae" stroke-width="1.5"/>
  <text x="32" y="362" font-size="12" font-weight="bold" fill="#546e7a">Namespace bookinfo</text>
  <rect x="40" y="378" width="210" height="60" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5"/>
  <text x="145" y="404" text-anchor="middle" font-size="15" font-weight="bold" fill="#0d47a1">bookinfo-gateway</text>
  <text x="145" y="424" text-anchor="middle" font-size="12" fill="#0d47a1">Ziel: Waypoint-IP, Port 15008</text>
  <rect x="385" y="378" width="190" height="60" rx="6" fill="#e0f2f1" stroke="#00897b" stroke-width="2.5"/>
  <text x="480" y="404" text-anchor="middle" font-size="15" font-weight="bold" fill="#004d40">Waypoint</text>
  <text x="480" y="424" text-anchor="middle" font-size="12" fill="#004d40">wendet die Regel an</text>
  <rect x="730" y="378" width="190" height="60" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="825" y="404" text-anchor="middle" font-size="15" font-weight="bold" fill="#5d4037">productpage</text>
  <text x="825" y="424" text-anchor="middle" font-size="12" fill="#5d4037">Pod</text>
  <line x1="252" y1="408" x2="383" y2="408" stroke="#00897b" stroke-width="3.5" marker-end="url(#t)"/>
  <line x1="577" y1="408" x2="728" y2="408" stroke="#00897b" stroke-width="3.5" marker-end="url(#t)"/>
  <text x="652" y="398" text-anchor="middle" font-size="11" fill="#004d40">nur erlaubte Pfade</text>

  <rect x="20" y="470" width="920" height="40" rx="8" fill="#fafafa" stroke="#90a4ae" stroke-width="1.5"/>
  <text x="32" y="495" font-size="12" font-weight="bold" fill="#546e7a">Namespace istio-system</text>
  <text x="200" y="495" font-size="13" fill="#263238">ztunnel (Node von productpage) loggt:  <tspan font-weight="bold" fill="#004d40">src.workload="waypoint-..."</tspan></text>

  <text x="20" y="536" font-size="14" font-weight="bold" fill="#004d40">GET /api/v1/products über das Gateway ergibt HTTP 403, /productpage weiter 200</text>
  <text x="20" y="560" font-size="13" fill="#263238"><tspan font-weight="bold">Gateway-Log:</tspan> connect_originate/&lt;Waypoint-IP&gt;:15008      <tspan font-weight="bold" dx="24">Waypoint-Log:</tspan> 403 mit Namen der Policy</text>

  <rect x="10" y="584" width="940" height="124" rx="8" fill="#fafafa" stroke="#cfd8dc" stroke-width="1"/>
  <text x="24" y="610" font-size="13" fill="#263238"><tspan font-weight="bold">Warum A?</tspan> Das Gateway ist selbst ein Envoy. Es löst die Route auf die Pods hinter dem Service auf und umgeht so den Waypoint.</text>
  <text x="24" y="634" font-size="13" fill="#263238">Das gilt auch, wenn der Waypoint mit --for all läuft. Es gibt keine Fehlermeldung, mTLS ist in beiden Fällen an.</text>
  <text x="24" y="662" font-size="13" fill="#263238"><tspan font-weight="bold">Prüfen:</tspan> über das Gateway einen Pfad aufrufen, den die Regel verbietet. Ein 200 zeigt die Umgehung.</text>
  <text x="24" y="692" font-size="12" fill="#546e7a">Gemessen auf Istio 1.31.4, Kubernetes 1.37.2.</text>
</svg>
