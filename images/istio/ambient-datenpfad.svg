<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#37474f"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e7d32"/></marker>
  </defs>
  <rect width="960" height="470" fill="#ffffff"/>
  <text x="480" y="24" text-anchor="middle" font-size="18" font-weight="bold" fill="#263238">Datenpfad Pod A nach Pod B im Ambient Mode</text>

  <!-- Variante 1 -->
  <text x="20" y="56" font-size="15" font-weight="bold" fill="#263238">1. Nur Layer 4 (Secure Overlay, ohne Waypoint)</text>
  <rect x="20" y="75" width="130" height="70" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="85" y="106" text-anchor="middle" font-size="14" font-weight="bold" fill="#5d4037">Pod A</text>
  <text x="85" y="125" text-anchor="middle" font-size="11" fill="#5d4037">Node 1</text>
  <rect x="230" y="75" width="150" height="70" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="305" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">ztunnel</text>
  <text x="305" y="122" text-anchor="middle" font-size="11" fill="#1b5e20">Node 1</text>
  <text x="305" y="136" text-anchor="middle" font-size="11" fill="#1b5e20">Identität von Pod A</text>
  <rect x="580" y="75" width="150" height="70" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="655" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">ztunnel</text>
  <text x="655" y="122" text-anchor="middle" font-size="11" fill="#1b5e20">Node 2</text>
  <text x="655" y="136" text-anchor="middle" font-size="11" fill="#1b5e20">L4-Policy prüfen</text>
  <rect x="810" y="75" width="130" height="70" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="875" y="106" text-anchor="middle" font-size="14" font-weight="bold" fill="#5d4037">Pod B</text>
  <text x="875" y="125" text-anchor="middle" font-size="11" fill="#5d4037">Node 2</text>
  <line x1="150" y1="110" x2="228" y2="110" stroke="#37474f" stroke-width="2" marker-end="url(#a)"/>
  <line x1="382" y1="110" x2="578" y2="110" stroke="#2e7d32" stroke-width="3.5" marker-end="url(#g)"/>
  <line x1="732" y1="110" x2="808" y2="110" stroke="#37474f" stroke-width="2" marker-end="url(#a)"/>
  <text x="480" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b5e20">HBONE (mTLS)</text>
  <text x="189" y="102" text-anchor="middle" font-size="10" fill="#37474f">Klartext</text>
  <text x="770" y="102" text-anchor="middle" font-size="10" fill="#37474f">Klartext</text>
  <text x="20" y="172" font-size="12" fill="#37474f">Es gibt nur zwei Hops. Verschlüsselt wird nur zwischen den Nodes, die Identität (SPIFFE) ist die des Pods bzw. seines ServiceAccounts.</text>

  <line x1="20" y1="195" x2="940" y2="195" stroke="#cfd8dc" stroke-width="1"/>

  <!-- Variante 2 -->
  <text x="20" y="226" font-size="15" font-weight="bold" fill="#263238">2. Mit Waypoint (Layer 7)</text>
  <rect x="20" y="248" width="110" height="80" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="75" y="284" text-anchor="middle" font-size="14" font-weight="bold" fill="#5d4037">Pod A</text>
  <text x="75" y="303" text-anchor="middle" font-size="11" fill="#5d4037">Node 1</text>
  <rect x="190" y="248" width="120" height="80" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="250" y="280" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">ztunnel</text>
  <text x="250" y="298" text-anchor="middle" font-size="11" fill="#1b5e20">Node 1</text>
  <rect x="370" y="248" width="220" height="80" rx="6" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
  <text x="480" y="274" text-anchor="middle" font-size="14" font-weight="bold" fill="#311b92">Waypoint (Envoy)</text>
  <text x="480" y="292" text-anchor="middle" font-size="11" fill="#311b92">HTTPRoute, Retries, Timeouts,</text>
  <text x="480" y="307" text-anchor="middle" font-size="11" fill="#311b92">L7-AuthorizationPolicy</text>
  <rect x="650" y="248" width="120" height="80" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="710" y="280" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">ztunnel</text>
  <text x="710" y="298" text-anchor="middle" font-size="11" fill="#1b5e20">Node 2</text>
  <rect x="830" y="248" width="110" height="80" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="885" y="284" text-anchor="middle" font-size="14" font-weight="bold" fill="#5d4037">Pod B</text>
  <text x="885" y="303" text-anchor="middle" font-size="11" fill="#5d4037">Node 2</text>
  <line x1="130" y1="288" x2="188" y2="288" stroke="#37474f" stroke-width="2" marker-end="url(#a)"/>
  <line x1="312" y1="288" x2="368" y2="288" stroke="#2e7d32" stroke-width="3.5" marker-end="url(#g)"/>
  <line x1="592" y1="288" x2="648" y2="288" stroke="#2e7d32" stroke-width="3.5" marker-end="url(#g)"/>
  <line x1="772" y1="288" x2="828" y2="288" stroke="#37474f" stroke-width="2" marker-end="url(#a)"/>
  <text x="340" y="270" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b5e20">HBONE</text>
  <text x="620" y="270" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b5e20">HBONE</text>
  <text x="20" y="356" font-size="12" fill="#37474f">Der Waypoint hängt als zusätzlicher Hop dazwischen, aber nur für Services bzw. Namespaces, die ihn per Label verwenden (istio.io/use-waypoint).</text>
  <text x="20" y="374" font-size="12" fill="#37474f">Der Waypoint ist ein Envoy, den man per Gateway API (gatewayClassName: istio-waypoint) ausrollt. Skalierung und Ressourcen gehören dem Namespace, nicht dem Node.</text>

  <!-- Legende -->
  <rect x="20" y="398" width="920" height="54" rx="6" fill="#f5f7f8" stroke="#cfd8dc"/>
  <line x1="40" y1="425" x2="90" y2="425" stroke="#2e7d32" stroke-width="3.5" marker-end="url(#g)"/>
  <text x="100" y="429" font-size="12" fill="#263238">verschlüsselt (HBONE, mTLS)</text>
  <line x1="340" y1="425" x2="390" y2="425" stroke="#37474f" stroke-width="2" marker-end="url(#a)"/>
  <text x="400" y="429" font-size="12" fill="#263238">unverschlüsselt, lokal auf dem Node (Pod und ztunnel)</text>
</svg>
