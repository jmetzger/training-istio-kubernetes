<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 546" width="920" height="546" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#37474f"/></marker>
  </defs>
  <rect width="920" height="546" fill="#ffffff"/>
  <text x="460" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#263238">Ambient: In welchem Log schaue ich nach?</text>
  <text x="460" y="46" text-anchor="middle" font-size="12" fill="#546e7a">Beispiel: reviews ruft ratings auf, dazwischen liegt der Waypoint</text>

  <!-- Node-Spalten -->
  <rect x="150" y="62" width="230" height="270" rx="6" fill="#fafafa" stroke="#b0bec5" stroke-width="1.5"/>
  <rect x="395" y="62" width="230" height="270" rx="6" fill="#fafafa" stroke="#b0bec5" stroke-width="1.5"/>
  <rect x="640" y="62" width="230" height="270" rx="6" fill="#fafafa" stroke="#b0bec5" stroke-width="1.5"/>
  <text x="265" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#455a64">Node 1</text>
  <text x="510" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#455a64">Node 2</text>
  <text x="755" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#455a64">Node 3</text>

  <!-- Namespace-Zeilen -->
  <text x="20" y="150" font-size="13" font-weight="bold" fill="#263238">Namespace</text>
  <text x="20" y="167" font-size="13" font-weight="bold" fill="#263238">istio-system</text>
  <text x="20" y="262" font-size="13" font-weight="bold" fill="#263238">Namespace</text>
  <text x="20" y="279" font-size="13" font-weight="bold" fill="#263238">bookinfo</text>
  <line x1="15" y1="214" x2="880" y2="214" stroke="#cfd8dc" stroke-width="1" stroke-dasharray="5 4"/>

  <!-- ztunnel je Node -->
  <rect x="170" y="108" width="190" height="62" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/>
  <text x="265" y="136" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">ztunnel</text>
  <text x="265" y="155" text-anchor="middle" font-size="11" fill="#1b5e20">Node 1</text>
  <rect x="415" y="108" width="190" height="62" rx="6" fill="#e8f5e9" stroke="#90a4ae" stroke-width="1.5"/>
  <text x="510" y="136" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">ztunnel</text>
  <text x="510" y="155" text-anchor="middle" font-size="11" fill="#1b5e20">Node 2</text>
  <rect x="660" y="108" width="190" height="62" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="3"/>
  <text x="755" y="136" text-anchor="middle" font-size="14" font-weight="bold" fill="#b71c1c">ztunnel</text>
  <text x="755" y="155" text-anchor="middle" font-size="11" fill="#b71c1c">Node 3</text>

  <!-- Pods -->
  <rect x="185" y="250" width="160" height="56" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="265" y="284" text-anchor="middle" font-size="14" font-weight="bold" fill="#5d4037">reviews</text>
  <rect x="430" y="250" width="160" height="56" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="3"/>
  <text x="510" y="284" text-anchor="middle" font-size="14" font-weight="bold" fill="#0d47a1">Waypoint</text>
  <rect x="675" y="250" width="160" height="56" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="755" y="284" text-anchor="middle" font-size="14" font-weight="bold" fill="#5d4037">ratings</text>

  <!-- Pfeile -->
  <line x1="235" y1="248" x2="235" y2="172" stroke="#37474f" stroke-width="2" marker-end="url(#a)"/>
  <line x1="362" y1="128" x2="413" y2="128" stroke="#37474f" stroke-width="2" marker-end="url(#a)"/>
  <line x1="480" y1="172" x2="480" y2="248" stroke="#37474f" stroke-width="2" marker-end="url(#a)"/>
  <line x1="540" y1="248" x2="540" y2="172" stroke="#37474f" stroke-width="2" marker-end="url(#a)"/>
  <line x1="607" y1="152" x2="658" y2="152" stroke="#37474f" stroke-width="2" marker-end="url(#a)"/>
  <line x1="785" y1="172" x2="785" y2="248" stroke="#37474f" stroke-width="2" marker-end="url(#a)"/>
  <text x="388" y="120" text-anchor="middle" font-size="11" fill="#37474f">HBONE</text>
  <text x="633" y="144" text-anchor="middle" font-size="11" fill="#37474f">HBONE</text>

  <!-- Hop-Nummern -->
  <circle cx="388" cy="146" r="11" fill="#37474f"/><text x="388" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">1</text>
  <circle cx="633" cy="170" r="11" fill="#37474f"/><text x="633" y="174" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">2</text>

  <!-- Buchstaben-Marker -->
  <circle cx="180" cy="118" r="11" fill="#2e7d32"/><text x="180" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">A</text>
  <circle cx="440" cy="260" r="11" fill="#1565c0"/><text x="440" y="264" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">B</text>
  <circle cx="670" cy="118" r="11" fill="#c62828"/><text x="670" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">C</text>

  <!-- Erklaerungen -->
  <rect x="150" y="352" width="230" height="178" rx="6" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
  <circle cx="170" cy="374" r="11" fill="#2e7d32"/><text x="170" y="378" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">A</text>
  <text x="188" y="379" font-size="13" font-weight="bold" fill="#1b5e20">ztunnel der Quelle</text>
  <text x="165" y="404" font-size="12" fill="#263238">Log-Feld: direction="outbound"</text>
  <text x="165" y="426" font-size="12" fill="#263238">Frage: Wohin ging die</text>
  <text x="165" y="442" font-size="12" fill="#263238">Verbindung von reviews?</text>
  <text x="165" y="466" font-size="12" fill="#263238">Das Ziel steht in dst.workload,</text>
  <text x="165" y="482" font-size="12" fill="#263238">hier der Waypoint.</text>

  <rect x="395" y="352" width="230" height="178" rx="6" fill="#ffffff" stroke="#1565c0" stroke-width="2"/>
  <circle cx="415" cy="374" r="11" fill="#1565c0"/><text x="415" y="378" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">B</text>
  <text x="433" y="379" font-size="13" font-weight="bold" fill="#0d47a1">Waypoint (Layer 7)</text>
  <text x="410" y="404" font-size="12" fill="#263238">Regeln auf Pfad, Methode,</text>
  <text x="410" y="420" font-size="12" fill="#263238">Header, HTTP-Status.</text>
  <text x="410" y="444" font-size="12" fill="#263238">Schreibt von sich aus nichts</text>
  <text x="410" y="460" font-size="12" fill="#263238">zu Anfragen. Erst mit Telemetry</text>
  <text x="410" y="476" font-size="12" fill="#263238">(Access-Log) oder rbac:debug.</text>
  <text x="410" y="500" font-size="12" fill="#263238">Der Log nennt die Policy,</text>
  <text x="410" y="516" font-size="12" fill="#263238">die abgelehnt hat.</text>

  <rect x="640" y="352" width="230" height="178" rx="6" fill="#ffffff" stroke="#c62828" stroke-width="2"/>
  <circle cx="660" cy="374" r="11" fill="#c62828"/><text x="660" y="378" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">C</text>
  <text x="678" y="379" font-size="13" font-weight="bold" fill="#b71c1c">ztunnel des Ziels (Layer 4)</text>
  <text x="655" y="404" font-size="12" fill="#263238">Policy auf Identit&#228;t, Namespace,</text>
  <text x="655" y="420" font-size="12" fill="#263238">Port. Log-Feld: direction="inbound"</text>
  <text x="655" y="444" font-size="12" fill="#263238">Suche: policy rejection</text>
  <text x="655" y="468" font-size="12" fill="#263238">src.identity zeigt, wer wirklich</text>
  <text x="655" y="484" font-size="12" fill="#263238">ankam. Hier der Waypoint,</text>
  <text x="655" y="500" font-size="12" fill="#263238">nicht reviews.</text>
</svg>
