<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="Arial, Helvetica, sans-serif">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#37474f"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1565c0"/></marker>
</defs>
<rect width="960" height="400" fill="#ffffff"/>
<text x="480" y="24" text-anchor="middle" font-size="18" font-weight="bold" fill="#263238">Upgrade-Workflow: Version in Git ändern</text>

<rect x="20" y="50" width="280" height="100" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="2.5"/>
<text x="160" y="78" text-anchor="middle" font-size="15" font-weight="bold" fill="#37474f">1. Git-Branch</text>
<text x="160" y="102" text-anchor="middle" font-size="12" fill="#37474f">targetRevision ändern:</text>
<text x="160" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#37474f">1.24.2 → 1.25.0</text>
<line x1="302" y1="100" x2="338" y2="100" stroke="#37474f" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="340" y="50" width="280" height="100" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="2.5"/>
<text x="480" y="78" text-anchor="middle" font-size="15" font-weight="bold" fill="#37474f">2. PR-Review</text>
<text x="480" y="102" text-anchor="middle" font-size="12" fill="#37474f">Diff prüfen:</text>
<text x="480" y="122" text-anchor="middle" font-size="12" fill="#37474f">Release Notes, Breaking Changes</text>
<line x1="622" y1="100" x2="658" y2="100" stroke="#37474f" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="660" y="50" width="280" height="100" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5"/>
<text x="800" y="78" text-anchor="middle" font-size="15" font-weight="bold" fill="#0d47a1">3. Merge</text>
<text x="800" y="102" text-anchor="middle" font-size="12" fill="#0d47a1">ArgoCD synced</text>
<text x="800" y="122" text-anchor="middle" font-size="12" fill="#0d47a1">automatisch</text>

<path d="M800 152 V204 M170 204 H830" fill="none" stroke="#1565c0" stroke-width="2.5"/>
<text x="480" y="194" text-anchor="middle" font-size="12" fill="#0d47a1">ArgoCD synced die geänderten Applications</text>
<line x1="170" y1="204" x2="170" y2="246" stroke="#1565c0" stroke-width="2.5" marker-end="url(#b)"/>
<line x1="390" y1="204" x2="390" y2="246" stroke="#1565c0" stroke-width="2.5" marker-end="url(#b)"/>
<line x1="610" y1="204" x2="610" y2="246" stroke="#1565c0" stroke-width="2.5" marker-end="url(#b)"/>
<line x1="830" y1="204" x2="830" y2="246" stroke="#1565c0" stroke-width="2.5" marker-end="url(#b)"/>

<rect x="70" y="248" width="200" height="76" rx="8" fill="#eceff1" stroke="#607d8b" stroke-width="2"/>
<text x="170" y="276" text-anchor="middle" font-size="15" font-weight="bold" fill="#37474f">istio-base</text>
<text x="170" y="298" text-anchor="middle" font-size="12" fill="#37474f">CRDs werden</text>
<text x="170" y="313" text-anchor="middle" font-size="12" fill="#37474f">aktualisiert</text>
<rect x="290" y="248" width="200" height="76" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="390" y="276" text-anchor="middle" font-size="15" font-weight="bold" fill="#0d47a1">istiod</text>
<text x="390" y="298" text-anchor="middle" font-size="12" fill="#0d47a1">Rollout</text>
<text x="390" y="313" text-anchor="middle" font-size="12" fill="#0d47a1">(Deployment)</text>
<rect x="510" y="248" width="200" height="76" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="610" y="276" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b5e20">istio-cni</text>
<text x="610" y="298" text-anchor="middle" font-size="12" fill="#1b5e20">Rollout</text>
<text x="610" y="313" text-anchor="middle" font-size="12" fill="#1b5e20">(DaemonSet)</text>
<rect x="730" y="248" width="200" height="76" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="830" y="276" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b5e20">ztunnel</text>
<text x="830" y="298" text-anchor="middle" font-size="12" fill="#1b5e20">Rollout (DaemonSet),</text>
<text x="830" y="313" text-anchor="middle" font-size="12" fill="#1b5e20">pro Node kurzer Traffic-Umbruch</text>

<rect x="8" y="346" width="944" height="42" rx="6" fill="#f5f7f8" stroke="#cfd8dc"/>
<text x="22" y="364" font-size="12" fill="#263238"><tspan font-weight="bold">Alle Komponenten auf dieselbe Version heben:</tspan> targetRevision bei base, istiod, cni und ztunnel einheitlich ändern.</text>
<text x="22" y="380" font-size="12" fill="#263238">Wie bei jeder Änderung gilt: nur über Git, kein kubectl am Cluster.</text>
</svg>
