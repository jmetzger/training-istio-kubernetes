<text x="22" y="714" font-size="12" fill="#263238"><tspan font-weight="bold">Spalten = Nodes.</tspan> Pro Node laufen ztunnel und istio-cni (immer). Die grüne Linie: Der Traffic aller Pods eines Nodes wird zum ztunnel umgeleitet.</text>
<text x="22" y="733" font-size="12" fill="#263238"><tspan font-weight="bold">Zeilen = Namespaces.</tspan> istio-system gehört der Plattform (istiod, ztunnel, istio-cni). Die Namespaces der Anwendungen erstrecken sich über mehrere Nodes.</text>
<text x="22" y="752" font-size="12" fill="#263238"><tspan font-weight="bold">Waypoint:</tspan> liegt im Namespace der Anwendung, nicht in istio-system. Er ist optional (gestrichelt) und bringt Layer 7 nur dorthin, wo man es braucht.</text>
<text x="22" y="771" font-size="12" fill="#263238"><tspan font-weight="bold">istiod</tspan> konfiguriert ztunnel und Waypoints. Der Traffic der Anwendungen läuft nie durch istiod.</text>
