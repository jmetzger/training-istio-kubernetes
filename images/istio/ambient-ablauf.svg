<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#37474f"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e7d32"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1565c0"/></marker>
  </defs>
  <rect width="960" height="620" fill="#ffffff"/>
  <text x="480" y="24" text-anchor="middle" font-size="18" font-weight="bold" fill="#263238">Ablauf: Konfiguration verteilen, dann Request durchs Mesh</text>

  <!-- Teilnehmer -->
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <rect x="20" y="44" width="100" height="40" rx="6" fill="#eceff1" stroke="#607d8b" stroke-width="2"/><text x="70" y="69" fill="#263238">Admin</text>
    <rect x="160" y="44" width="100" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/><text x="210" y="69" fill="#0d47a1">istiod</text>
    <rect x="300" y="44" width="100" height="40" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/><text x="350" y="69" fill="#5d4037">Pod A</text>
    <rect x="440" y="44" width="110" height="40" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/><text x="495" y="69" fill="#1b5e20">ztunnel N1</text>
    <rect x="590" y="44" width="110" height="40" rx="6" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/><text x="645" y="69" fill="#311b92">Waypoint</text>
    <rect x="740" y="44" width="110" height="40" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/><text x="795" y="69" fill="#1b5e20">ztunnel N2</text>
    <rect x="870" y="44" width="80" height="40" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/><text x="910" y="69" fill="#5d4037">Pod B</text>
  </g>
  <!-- Lebenslinien -->
  <g stroke="#b0bec5" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="70" y1="84" x2="70" y2="520"/><line x1="210" y1="84" x2="210" y2="520"/><line x1="350" y1="84" x2="350" y2="520"/>
    <line x1="495" y1="84" x2="495" y2="520"/><line x1="645" y1="84" x2="645" y2="520"/><line x1="795" y1="84" x2="795" y2="520"/><line x1="910" y1="84" x2="910" y2="520"/>
  </g>

  <!-- Phase 1 -->
  <rect x="20" y="96" width="920" height="22" fill="#e3f2fd"/>
  <text x="30" y="112" font-size="12" font-weight="bold" fill="#0d47a1">Phase 1: Konfiguration (Control Plane nach Data Plane)</text>
  <line x1="72" y1="140" x2="208" y2="140" stroke="#1565c0" stroke-width="2" marker-end="url(#b)"/>
  <text x="140" y="132" text-anchor="middle" font-size="11" fill="#0d47a1">1. kubectl apply</text>
  <text x="140" y="154" text-anchor="middle" font-size="10" fill="#0d47a1">HTTPRoute, Policy</text>
  <text x="214" y="172" font-size="11" fill="#0d47a1">2. istiod validiert und übersetzt</text>
  <line x1="212" y1="198" x2="493" y2="198" stroke="#1565c0" stroke-width="2" marker-end="url(#b)"/>
  <line x1="212" y1="216" x2="643" y2="216" stroke="#1565c0" stroke-width="2" marker-end="url(#b)"/>
  <line x1="212" y1="234" x2="793" y2="234" stroke="#1565c0" stroke-width="2" marker-end="url(#b)"/>
  <text x="352" y="192" text-anchor="middle" font-size="11" fill="#0d47a1">3. xDS-Push (ztunnel: + Zertifikate)</text>

  <!-- Phase 2 -->
  <rect x="20" y="252" width="920" height="22" fill="#e8f5e9"/>
  <text x="30" y="268" font-size="12" font-weight="bold" fill="#1b5e20">Phase 2: Request (Pod A ruft Service von Pod B auf)</text>
  <line x1="352" y1="296" x2="493" y2="296" stroke="#37474f" stroke-width="2" marker-end="url(#a)"/>
  <text x="422" y="288" text-anchor="middle" font-size="11" fill="#263238">4. Request</text>
  <text x="422" y="311" text-anchor="middle" font-size="10" fill="#263238">(durch istio-cni umgeleitet)</text>
  <line x1="497" y1="338" x2="643" y2="338" stroke="#2e7d32" stroke-width="3" marker-end="url(#g)"/>
  <text x="570" y="330" text-anchor="middle" font-size="11" fill="#1b5e20">5. HBONE (mTLS)</text>
  <rect x="610" y="358" width="70" height="46" rx="4" fill="#ede7f6" stroke="#5e35b1"/>
  <text x="645" y="376" text-anchor="middle" font-size="10" fill="#311b92">6. L7: Route,</text>
  <text x="645" y="390" text-anchor="middle" font-size="10" fill="#311b92">Retry, AuthZ</text>
  <line x1="647" y1="428" x2="793" y2="428" stroke="#2e7d32" stroke-width="3" marker-end="url(#g)"/>
  <text x="720" y="420" text-anchor="middle" font-size="11" fill="#1b5e20">7. HBONE (mTLS)</text>
  <rect x="760" y="446" width="70" height="36" rx="4" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="795" y="461" text-anchor="middle" font-size="10" fill="#1b5e20">8. L4-Policy</text>
  <text x="795" y="474" text-anchor="middle" font-size="10" fill="#1b5e20">prüfen</text>
  <line x1="797" y1="500" x2="908" y2="500" stroke="#37474f" stroke-width="2" marker-end="url(#a)"/>
  <text x="853" y="492" text-anchor="middle" font-size="11" fill="#263238">9. Weiterleitung</text>

  <!-- Hinweis -->
  <rect x="20" y="534" width="920" height="70" rx="6" fill="#f5f7f8" stroke="#cfd8dc"/>
  <text x="36" y="556" font-size="12" fill="#263238"><tspan font-weight="bold">Ohne Waypoint</tspan> entfallen Schritt 6 und der zweite Hop: ztunnel N1 spricht direkt mit ztunnel N2.</text>
  <text x="36" y="576" font-size="12" fill="#263238"><tspan font-weight="bold">Metriken</tspan> kommen nicht über istiod: ztunnel (Layer 4) und Waypoint (Layer 7) werden von Prometheus abgefragt.</text>
  <text x="36" y="596" font-size="12" fill="#263238"><tspan font-weight="bold">Antworten</tspan> laufen denselben Weg zurück (nicht eingezeichnet).</text>
</svg>
