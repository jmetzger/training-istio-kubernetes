<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#37474f"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c62828"/></marker>
  </defs>
  <rect width="920" height="400" fill="#ffffff"/>
  <text x="460" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#263238">Egress in Ambient: Waypoint als Egress-Gateway</text>
  <text x="460" y="46" text-anchor="middle" font-size="12" fill="#546e7a">Der Weg nach draussen fuehrt nur noch ueber den Waypoint im Namespace istio-egress</text>

  <!-- Namespace egress-demo -->
  <rect x="20" y="70" width="250" height="230" rx="8" fill="#f5f9fc" stroke="#78909c" stroke-width="1.5"/>
  <text x="145" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#37474f">Namespace egress-demo</text>
  <text x="145" y="108" text-anchor="middle" font-size="11" fill="#546e7a">istio.io/dataplane-mode=ambient</text>
  <rect x="50" y="125" width="190" height="55" rx="6" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.5"/>
  <text x="145" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#0d47a1">Pod curl</text>
  <text x="145" y="168" text-anchor="middle" font-size="11" fill="#37474f">curl http://httpbin.org/get</text>
  <rect x="50" y="200" width="190" height="45" rx="6" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5"/>
  <text x="145" y="220" text-anchor="middle" font-size="13" font-weight="bold" fill="#e65100">ztunnel (Node)</text>
  <text x="145" y="236" text-anchor="middle" font-size="11" fill="#37474f">faengt den Verkehr ab</text>
  <text x="145" y="272" text-anchor="middle" font-size="11" font-weight="bold" fill="#c62828">NetworkPolicy: Egress nur</text>
  <text x="145" y="287" text-anchor="middle" font-size="11" font-weight="bold" fill="#c62828">DNS und Waypoint :15008</text>

  <!-- Namespace istio-egress -->
  <rect x="340" y="70" width="290" height="230" rx="8" fill="#f1f8f1" stroke="#78909c" stroke-width="1.5"/>
  <text x="485" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#37474f">Namespace istio-egress</text>
  <text x="485" y="108" text-anchor="middle" font-size="11" fill="#546e7a">istio.io/use-waypoint=waypoint</text>
  <rect x="365" y="125" width="240" height="70" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="485" y="148" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">Waypoint (Egress-Gateway)</text>
  <text x="485" y="166" text-anchor="middle" font-size="11" fill="#37474f">Layer 7: Methode und Pfad pruefen</text>
  <text x="485" y="182" text-anchor="middle" font-size="11" fill="#37474f">TLS zum Ziel aufbauen</text>
  <rect x="365" y="210" width="240" height="75" rx="6" fill="#ffffff" stroke="#9e9e9e" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="485" y="229" text-anchor="middle" font-size="11" fill="#37474f">ServiceEntry httpbin.org</text>
  <text x="485" y="246" text-anchor="middle" font-size="11" fill="#37474f">AuthorizationPolicy (nur GET /get)</text>
  <text x="485" y="263" text-anchor="middle" font-size="11" fill="#37474f">DestinationRule (TLS SIMPLE)</text>

  <!-- Internet -->
  <rect x="700" y="70" width="200" height="230" rx="8" fill="#fafafa" stroke="#78909c" stroke-width="1.5"/>
  <text x="800" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#37474f">Internet</text>
  <rect x="725" y="125" width="150" height="55" rx="6" fill="#eceff1" stroke="#546e7a" stroke-width="1.5"/>
  <text x="800" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#263238">httpbin.org</text>
  <text x="800" y="168" text-anchor="middle" font-size="11" fill="#37474f">Port 443 (HTTPS)</text>
  <rect x="725" y="215" width="150" height="55" rx="6" fill="#eceff1" stroke="#546e7a" stroke-width="1.5"/>
  <text x="800" y="240" text-anchor="middle" font-size="14" font-weight="bold" fill="#263238">example.com</text>
  <text x="800" y="258" text-anchor="middle" font-size="11" fill="#37474f">kein ServiceEntry</text>

  <!-- Pfeile -->
  <line x1="240" y1="222" x2="363" y2="165" stroke="#37474f" stroke-width="2" marker-end="url(#a)"/>
  <text x="300" y="183" text-anchor="middle" font-size="11" fill="#37474f" transform="rotate(-24 300 183)">HBONE :15008</text>
  <line x1="605" y1="160" x2="723" y2="153" stroke="#37474f" stroke-width="2" marker-end="url(#a)"/>
  <text x="664" y="145" text-anchor="middle" font-size="11" fill="#37474f">HTTPS</text>
  <line x1="240" y1="238" x2="723" y2="245" stroke="#c62828" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#r)"/>
  <text x="470" y="330" text-anchor="middle" font-size="12" font-weight="bold" fill="#c62828">gestrichelt: direkter Weg am Waypoint vorbei - ohne NetworkPolicy offen, mit NetworkPolicy blockiert</text>
  <text x="470" y="352" text-anchor="middle" font-size="12" fill="#546e7a">Merksatz: Der Waypoint steuert den Weg. Erzwingen muss ihn eine NetworkPolicy.</text>
