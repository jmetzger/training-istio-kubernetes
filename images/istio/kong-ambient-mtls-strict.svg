<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#37474f"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e7d32"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c62828"/></marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="480" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#263238">PeerAuthentication STRICT in kong-demo: Kong im Mesh oder nicht</text>

  <!-- oben: Kong im Mesh -->
  <text x="20" y="62" font-size="15" font-weight="bold" fill="#263238">Namespace kong ist im Ambient-Mesh (Label istio.io/dataplane-mode=ambient)</text>
  <rect x="30" y="80" width="190" height="80" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5"/>
  <text x="125" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#0d47a1">Kong Gateway</text>
  <text x="125" y="132" text-anchor="middle" font-size="12" fill="#0d47a1">Namespace kong</text>
  <rect x="370" y="90" width="220" height="60" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="480" y="116" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b5e20">ztunnel</text>
  <text x="480" y="134" text-anchor="middle" font-size="12" fill="#1b5e20">sendet mit Identität von Kong</text>
  <rect x="740" y="80" width="190" height="80" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="835" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#5d4037">httpbin</text>
  <text x="835" y="132" text-anchor="middle" font-size="12" fill="#5d4037">Namespace kong-demo, STRICT</text>
  <line x1="222" y1="120" x2="368" y2="120" stroke="#37474f" stroke-width="3" marker-end="url(#a)"/>
  <text x="295" y="110" text-anchor="middle" font-size="12" fill="#37474f">HTTP</text>
  <line x1="592" y1="120" x2="738" y2="120" stroke="#2e7d32" stroke-width="4" marker-end="url(#g)"/>
  <text x="665" y="110" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b5e20">HBONE (mTLS)</text>
  <rect x="345" y="172" width="270" height="34" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="480" y="194" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">Ergebnis: HTTP 200</text>

  <line x1="20" y1="226" x2="940" y2="226" stroke="#cfd8dc" stroke-width="1.5"/>

  <!-- unten: Kong ausserhalb -->
  <text x="20" y="256" font-size="15" font-weight="bold" fill="#263238">Namespace kong ist nicht im Mesh (Label entfernt)</text>
  <rect x="30" y="274" width="190" height="80" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5"/>
  <text x="125" y="306" text-anchor="middle" font-size="15" font-weight="bold" fill="#0d47a1">Kong Gateway</text>
  <text x="125" y="326" text-anchor="middle" font-size="12" fill="#0d47a1">Namespace kong</text>
  <rect x="370" y="284" width="220" height="60" rx="6" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="480" y="310" text-anchor="middle" font-size="15" font-weight="bold" fill="#757575">kein ztunnel</text>
  <text x="480" y="328" text-anchor="middle" font-size="12" fill="#757575">für diesen Pod</text>
  <rect x="740" y="274" width="190" height="80" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="835" y="306" text-anchor="middle" font-size="15" font-weight="bold" fill="#5d4037">httpbin</text>
  <text x="835" y="326" text-anchor="middle" font-size="12" fill="#5d4037">Namespace kong-demo, STRICT</text>
  <path d="M222,314 L400,314" fill="none" stroke="#c62828" stroke-width="3"/>
  <path d="M590,314 L738,314" fill="none" stroke="#c62828" stroke-width="3.5" marker-end="url(#r)"/>
  <line x1="640" y1="298" x2="640" y2="330" stroke="#c62828" stroke-width="5"/>
  <text x="665" y="302" font-size="12" font-weight="bold" fill="#c62828">Klartext</text>
  <text x="300" y="304" text-anchor="middle" font-size="12" fill="#c62828">HTTP</text>
  <rect x="345" y="366" width="270" height="34" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="1.5"/>
  <text x="480" y="388" text-anchor="middle" font-size="14" font-weight="bold" fill="#b71c1c">Ergebnis: Kong meldet HTTP 502</text>

  <rect x="10" y="420" width="940" height="88" rx="8" fill="#fafafa" stroke="#cfd8dc" stroke-width="1"/>
  <text x="24" y="444" font-size="13" fill="#263238"><tspan font-weight="bold">Oben:</tspan> der ztunnel baut den HBONE-Tunnel mit der Identität von Kong auf. STRICT ist erfüllt.</text>
  <text x="24" y="466" font-size="13" fill="#263238"><tspan font-weight="bold">Unten:</tspan> Kong spricht Klartext. Der ztunnel von httpbin lehnt ihn wegen STRICT ab, bei Kong kommt ein 502 an.</text>
  <text x="24" y="488" font-size="13" fill="#263238"><tspan font-weight="bold">Folge:</tspan> Wer STRICT einsetzt, muss auch den Kong-Namespace ins Mesh nehmen. Ein Neustart des Kong-Pods ist dafür nicht nötig.</text>
</svg>
