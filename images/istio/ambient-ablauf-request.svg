<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#37474f"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e7d32"/></marker>
  </defs>
  <rect width="960" height="500" fill="#ffffff"/>
  <text x="480" y="24" text-anchor="middle" font-size="18" font-weight="bold" fill="#263238">Ablauf Request: Pod A ruft einen Service von Pod B auf</text>

  <g font-size="13" font-weight="bold" text-anchor="middle">
    <rect x="40" y="44" width="120" height="40" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/><text x="100" y="69" fill="#5d4037">Pod A</text>
    <rect x="230" y="44" width="120" height="40" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/><text x="290" y="69" fill="#1b5e20">ztunnel Node 1</text>
    <rect x="420" y="44" width="120" height="40" rx="6" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/><text x="480" y="69" fill="#311b92">Waypoint</text>
    <rect x="610" y="44" width="120" height="40" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/><text x="670" y="69" fill="#1b5e20">ztunnel Node 2</text>
    <rect x="800" y="44" width="120" height="40" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/><text x="860" y="69" fill="#5d4037">Pod B</text>
  </g>
  <g stroke="#b0bec5" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="100" y1="84" x2="100" y2="390"/><line x1="290" y1="84" x2="290" y2="390"/><line x1="480" y1="84" x2="480" y2="390"/>
    <line x1="670" y1="84" x2="670" y2="390"/><line x1="860" y1="84" x2="860" y2="390"/>
  </g>

  <line x1="102" y1="130" x2="288" y2="130" stroke="#37474f" stroke-width="2" marker-end="url(#a)"/>
  <text x="195" y="120" text-anchor="middle" font-size="12" fill="#263238">1. Request</text>
  <text x="195" y="148" text-anchor="middle" font-size="10" fill="#263238">(durch istio-cni umgeleitet)</text>

  <line x1="292" y1="190" x2="478" y2="190" stroke="#2e7d32" stroke-width="3" marker-end="url(#g)"/>
  <text x="385" y="180" text-anchor="middle" font-size="12" fill="#1b5e20">2. HBONE (mTLS)</text>

  <rect x="400" y="212" width="160" height="40" rx="4" fill="#ede7f6" stroke="#5e35b1"/>
  <text x="480" y="229" text-anchor="middle" font-size="11" fill="#311b92">3. Layer 7: Route, Retry,</text>
  <text x="480" y="243" text-anchor="middle" font-size="11" fill="#311b92">L7-AuthorizationPolicy</text>

  <line x1="482" y1="290" x2="668" y2="290" stroke="#2e7d32" stroke-width="3" marker-end="url(#g)"/>
  <text x="575" y="280" text-anchor="middle" font-size="12" fill="#1b5e20">4. HBONE (mTLS)</text>

  <rect x="590" y="312" width="160" height="30" rx="4" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="670" y="331" text-anchor="middle" font-size="11" fill="#1b5e20">5. L4-Policy prüfen</text>

  <line x1="672" y1="372" x2="858" y2="372" stroke="#37474f" stroke-width="2" marker-end="url(#a)"/>
  <text x="765" y="362" text-anchor="middle" font-size="12" fill="#263238">6. Weiterleitung</text>

  <rect x="20" y="410" width="920" height="72" rx="6" fill="#f5f7f8" stroke="#cfd8dc"/>
  <text x="36" y="432" font-size="12" fill="#263238"><tspan font-weight="bold">Ohne Waypoint</tspan> entfallen die Schritte 3 und 4: ztunnel Node 1 spricht direkt per HBONE mit ztunnel Node 2.</text>
  <text x="36" y="452" font-size="12" fill="#263238"><tspan font-weight="bold">Metriken</tspan> kommen nicht über istiod: ztunnel (Layer 4) und Waypoint (Layer 7) werden von Prometheus abgefragt.</text>
  <text x="36" y="472" font-size="12" fill="#263238"><tspan font-weight="bold">Antworten</tspan> laufen denselben Weg zurück (nicht eingezeichnet).</text>
</svg>
