<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" font-family="Arial, Helvetica, sans-serif">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#37474f"/></marker>
</defs>
<rect width="1000" height="480" fill="#ffffff"/>
<text x="500" y="24" text-anchor="middle" font-size="18" font-weight="bold" fill="#263238">Externe CA für Istio: Wer legt was an?</text>

<!-- Git -->
<rect x="20" y="58" width="200" height="74" rx="8" fill="#eceff1" stroke="#607d8b" stroke-width="2"/>
<text x="120" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#37474f">Git-Repo</text>
<text x="120" y="106" text-anchor="middle" font-size="11" fill="#37474f">Ordner apps/ und ca/</text>
<text x="120" y="122" text-anchor="middle" font-size="11" fill="#37474f">kein privater Schlüssel im Git</text>

<!-- Namespace argocd -->
<rect x="262" y="42" width="718" height="104" rx="8" fill="#f5f7f8" stroke="#90a4ae" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="274" y="60" font-size="12" font-weight="bold" fill="#546e7a">Namespace argocd</text>
<rect x="280" y="70" width="300" height="62" rx="8" fill="#eceff1" stroke="#607d8b" stroke-width="2"/>
<text x="430" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#37474f">Application cert-manager</text>
<text x="430" y="116" text-anchor="middle" font-size="11" fill="#37474f">Wave -5, Helm-Chart cert-manager</text>
<rect x="620" y="70" width="340" height="62" rx="8" fill="#eceff1" stroke="#607d8b" stroke-width="2"/>
<text x="790" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#37474f">Application istio-ca</text>
<text x="790" y="116" text-anchor="middle" font-size="11" fill="#37474f">Wave -4, Ordner ca/ (Issuer und Certificates)</text>

<!-- Namespace cert-manager -->
<rect x="20" y="172" width="960" height="104" rx="8" fill="#f5f7f8" stroke="#90a4ae" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="32" y="190" font-size="12" font-weight="bold" fill="#546e7a">Namespace cert-manager</text>
<rect x="280" y="200" width="300" height="62" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="430" y="225" text-anchor="middle" font-size="14" font-weight="bold" fill="#0d47a1">cert-manager</text>
<text x="430" y="246" text-anchor="middle" font-size="11" fill="#0d47a1">stellt die Zertifikate aus und erneuert sie</text>
<rect x="620" y="200" width="340" height="62" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
<text x="790" y="225" text-anchor="middle" font-size="14" font-weight="bold" fill="#37474f">Secret root-ca (Root-CA)</text>
<text x="790" y="246" text-anchor="middle" font-size="11" fill="#37474f">steht in der Übung für die externe CA</text>

<!-- Namespace istio-system -->
<rect x="20" y="302" width="960" height="104" rx="8" fill="#f5f7f8" stroke="#90a4ae" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="32" y="320" font-size="12" font-weight="bold" fill="#546e7a">Namespace istio-system</text>
<rect x="620" y="330" width="340" height="62" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
<text x="790" y="355" text-anchor="middle" font-size="14" font-weight="bold" fill="#37474f">Secret cacerts (Zwischen-CA)</text>
<text x="790" y="376" text-anchor="middle" font-size="11" fill="#37474f">aus Certificate istio-ca, gültig 90 Tage</text>
<rect x="280" y="330" width="300" height="62" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="430" y="355" text-anchor="middle" font-size="14" font-weight="bold" fill="#0d47a1">istiod</text>
<text x="430" y="376" text-anchor="middle" font-size="11" fill="#0d47a1">unterschreibt die Zertifikate der Workloads</text>
<rect x="40" y="330" width="200" height="62" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="140" y="355" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">ztunnel</text>
<text x="140" y="376" text-anchor="middle" font-size="11" fill="#1b5e20">holt Zertifikate für die Pods</text>

<!-- Pfeile -->
<line x1="222" y1="95" x2="260" y2="95" stroke="#37474f" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="430" y1="134" x2="430" y2="198" stroke="#37474f" stroke-width="2.5" marker-end="url(#a)"/>
<text x="438" y="164" font-size="11" fill="#37474f">installiert</text>
<line x1="790" y1="134" x2="790" y2="198" stroke="#37474f" stroke-width="2.5" marker-end="url(#a)"/>
<text x="798" y="164" font-size="11" fill="#37474f">legt Issuer und Certificates an</text>
<line x1="790" y1="264" x2="790" y2="328" stroke="#37474f" stroke-width="2.5" marker-end="url(#a)"/>
<text x="798" y="294" font-size="11" fill="#37474f">unterschreibt</text>
<line x1="618" y1="361" x2="582" y2="361" stroke="#37474f" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="278" y1="361" x2="242" y2="361" stroke="#37474f" stroke-width="2.5" marker-end="url(#a)"/>

<rect x="20" y="422" width="960" height="46" rx="6" fill="#f5f7f8" stroke="#cfd8dc"/>
<text x="34" y="442" font-size="12" fill="#263238"><tspan font-weight="bold">Vertrauenskette:</tspan> Root-CA → Zwischen-CA (cacerts) → Zertifikat des Workloads (24 Stunden gültig).</text>
<text x="34" y="459" font-size="12" fill="#263238">In Produktion bleibt der Schlüssel der Root-CA außerhalb des Clusters (Vault, Firmen-PKI). Im Cluster liegt nur die Zwischen-CA.</text>
</svg>
