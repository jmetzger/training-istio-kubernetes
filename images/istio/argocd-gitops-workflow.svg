<text x="412" y="308" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d47a1">istiod</text>
<text x="412" y="325" text-anchor="middle" font-size="11" fill="#0d47a1">App istiod</text>
<rect x="511" y="290" width="165" height="44" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="593" y="308" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b5e20">istio-cni</text>
<text x="593" y="325" text-anchor="middle" font-size="11" fill="#1b5e20">App istio-cni · DaemonSet</text>
<rect x="692" y="290" width="165" height="44" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="774" y="308" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b5e20">ztunnel</text>
<text x="774" y="325" text-anchor="middle" font-size="11" fill="#1b5e20">App ztunnel · DaemonSet</text>

<rect x="302" y="356" width="630" height="84" rx="10" fill="#fffde7" stroke="#f9a825" stroke-width="2.5"/>
<text x="316" y="374" font-size="13" font-weight="bold" fill="#e65100">Namespace bookinfo (ambient)</text>
<rect x="330" y="388" width="230" height="44" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="2.5"/>
<text x="445" y="406" text-anchor="middle" font-size="13" font-weight="bold" fill="#37474f">Anwendungs-Pods</text>
<text x="445" y="423" text-anchor="middle" font-size="11" fill="#37474f">App bookinfo</text>
<rect x="580" y="388" width="230" height="44" rx="6" fill="#ede7f6" stroke="#5e35b1" stroke-width="2" stroke-dasharray="7 4"/>
<text x="695" y="406" text-anchor="middle" font-size="13" font-weight="bold" fill="#311b92">Waypoint</text>
<text x="695" y="423" text-anchor="middle" font-size="11" fill="#311b92">optional, nur bei Layer-7-Bedarf</text>

<line x1="188" y1="112" x2="518" y2="112" stroke="#1565c0" stroke-width="2.5" marker-end="url(#b)"/>
<text x="239" y="102" text-anchor="middle" font-size="12" fill="#0d47a1">Soll-Zustand</text>
<text x="239" y="130" text-anchor="middle" font-size="12" fill="#0d47a1">per Pull</text>
<path d="M720 112 H900 V410" fill="none" stroke="#1565c0" stroke-width="2.5"/>
<text x="810" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#0d47a1">Helm template + apply</text>
<text x="810" y="130" text-anchor="middle" font-size="11" fill="#0d47a1">in Sync-Wave-Reihenfolge</text>
<line x1="900" y1="214" x2="814" y2="214" stroke="#1565c0" stroke-width="2.5" marker-end="url(#b)"/>
<line x1="900" y1="312" x2="861" y2="312" stroke="#1565c0" stroke-width="2.5" marker-end="url(#b)"/>
<line x1="900" y1="410" x2="814" y2="410" stroke="#1565c0" stroke-width="2.5" marker-end="url(#b)"/>

<rect x="8" y="464" width="944" height="30" rx="6" fill="#f5f7f8" stroke="#cfd8dc"/>
<text x="22" y="484" font-size="12" fill="#263238"><tspan font-weight="bold">App</tspan> = ArgoCD Application. Jede Zeile ist ein Namespace (bzw. die Cluster-Ebene), die blauen Pfeile zeigen, wohin ArgoCD ausrollt.</text>
</svg>
