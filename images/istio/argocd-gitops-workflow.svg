<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Arial, Helvetica, sans-serif">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#37474f"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1565c0"/></marker>
</defs>
<rect width="960" height="500" fill="#ffffff"/>
<text x="480" y="24" text-anchor="middle" font-size="18" font-weight="bold" fill="#263238">GitOps-Workflow: ArgoCD rollt Istio Ambient aus</text>

<rect x="16" y="290" width="170" height="60" rx="8" fill="#eceff1" stroke="#607d8b" stroke-width="2"/>
<text x="101" y="316" text-anchor="middle" font-size="15" font-weight="bold" fill="#37474f">Developer</text>
<text x="101" y="334" text-anchor="middle" font-size="11" fill="#37474f">Branch, Pull Request, Review</text>
<rect x="16" y="72" width="170" height="80" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="2.5"/>
<text x="101" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#37474f">Git-Repo</text>
<text x="101" y="116" text-anchor="middle" font-size="11" fill="#37474f">Source of Truth</text>
<text x="101" y="132" text-anchor="middle" font-size="11" fill="#37474f">apps/istio/, apps/bookinfo/</text>
<line x1="101" y1="288" x2="101" y2="154" stroke="#37474f" stroke-width="2" marker-end="url(#a)"/>
<text x="111" y="215" font-size="12" fill="#263238">git push /</text>
<text x="111" y="230" font-size="12" fill="#263238">Pull Request</text>


<rect x="290" y="36" width="654" height="420" rx="10" fill="none" stroke="#78909c" stroke-width="2.5"/>
<text x="304" y="56" font-size="14" font-weight="bold" fill="#546e7a">Kubernetes Cluster</text>

<rect x="302" y="66" width="630" height="84" rx="10" fill="#eef4fb" stroke="#1565c0" stroke-width="2.5"/>
<text x="316" y="84" font-size="13" font-weight="bold" fill="#0d47a1">Namespace argocd</text>
<rect x="520" y="88" width="200" height="48" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="620" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#0d47a1">ArgoCD Controller</text>
<text x="620" y="125" text-anchor="middle" font-size="11" fill="#0d47a1">vergleicht Git mit Cluster</text>

<rect x="302" y="166" width="630" height="78" rx="10" fill="#fafafa" stroke="#607d8b" stroke-width="2.5" stroke-dasharray="3 5"/>
<text x="316" y="184" font-size="13" font-weight="bold" fill="#455a64">Cluster-weit (CRDs)</text>
