<text x="445" y="210" text-anchor="middle" font-size="13" font-weight="bold" fill="#37474f">Gateway API CRDs</text>
<text x="445" y="227" text-anchor="middle" font-size="11" fill="#37474f">App gateway-api-crds</text>
<rect x="580" y="192" width="230" height="44" rx="6" fill="#eceff1" stroke="#607d8b" stroke-width="2"/>
<text x="695" y="210" text-anchor="middle" font-size="13" font-weight="bold" fill="#37474f">Istio CRDs</text>
<text x="695" y="227" text-anchor="middle" font-size="11" fill="#37474f">App istio-base</text>

<rect x="302" y="258" width="630" height="84" rx="10" fill="#eef4fb" stroke="#1565c0" stroke-width="2.5"/>
<text x="316" y="276" font-size="13" font-weight="bold" fill="#0d47a1">Namespace istio-system</text>
