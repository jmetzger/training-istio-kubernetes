<text x="45" y="672" text-anchor="start" font-size="13" fill="#1f2a30" font-weight="bold">Ohne Istio:</text>
<text x="130" y="672" text-anchor="start" font-size="12" fill="#1f2a30">kein Sidecar, kein ztunnel, kein Waypoint, kein mTLS im Mesh. Die Pods sprechen unverschlüsselt über den Service miteinander.</text>
<text x="45" y="694" text-anchor="start" font-size="12" fill="#1f2a30">Gateway, GatewayClass und HTTPRoute sind Kubernetes-Objekte (gateway.networking.k8s.io). Welcher Controller sie umsetzt, hängt von der GatewayClass ab.</text>
