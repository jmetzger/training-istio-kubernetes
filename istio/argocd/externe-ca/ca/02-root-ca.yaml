# Root-CA der Uebung. Sie steht fuer die externe CA (Firmen-PKI, Vault).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: root-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: Training Root CA
  subject:
    organizations:
      - Training
  secretName: root-ca
  duration: 87600h      # 10 Jahre
  privateKey:
    algorithm: RSA
    size: 4096
  issuerRef:
    kind: ClusterIssuer
    name: selfsigned
