# Root-CA der Uebung. Sie steht fuer die externe CA (Firmen-PKI, Vault).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: istio-ca
  namespace: istio-system
spec:
  isCA: true
  commonName: Training Root CA
  subject:
    organizations:
      - Training
  secretName: istio-ca
  duration: 87600h        # 10 Jahre
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    kind: Issuer
    name: selfsigned
