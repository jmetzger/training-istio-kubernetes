# ArgoCD Application: Issuer und Root-CA fuer istio-csr
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-csr-ca
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/jmetzger/training-istio-kubernetes.git
    targetRevision: main
    path: istio/argocd/istio-csr/ca
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
